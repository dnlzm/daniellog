# NOTE: baseURL is overridden automatically by the GitHub Actions workflow
# (actions/configure-pages), so this value only matters for local preview.
baseURL = "https://YOUR-GITHUB-USERNAME.github.io/daniellog/"
languageCode = "en-us"
title = "Daniellog"
theme = "PaperMod"
timeZone = "Europe/Berlin"

# Use static/robots.txt (do not let Hugo generate one)
enableRobotsTXT = false

[pagination]
  pagerSize = 10

[params]
  description = "Technical facts and field notes on AV networking, AVB/Milan, and church tech."
  author = "Daniel Zimmermann"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true

[params.homeInfoParams]
  Title = "Daniellog"
  Content = "Technical facts and field notes — AV networking, AVB/Milan, church tech."

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 20

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  style = "monokai"
  lineNos = false
